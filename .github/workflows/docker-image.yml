name: Web_Files_Download_Server

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-temporary-expose:
    runs-on: ubuntu-latest
    steps:
    # 1️⃣ 检出代码
    - uses: actions/checkout@v4

    # 2️⃣ Docker 登录
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 3️⃣ Build Docker 镜像
    - name: Build Docker image
      run: docker build . -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/web-files-server:latest

    # 4️⃣ Push 镜像
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/web-files-server:latest

    # ================= 临时访问部分 =================
    # 5️⃣ 安装 ngrok
    - name: Install ngrok
      run: |
        wget https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
        unzip ngrok-stable-linux-amd64.zip
        chmod +x ngrok
        sudo mv ngrok /usr/local/bin

    # 6️⃣ 启动容器 + ngrok 并打印临时 URL
    - name: Run Web Server and expose with ngrok
      run: |
        echo "Starting Docker container..."
        docker run -d -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/web-files-server:latest

        echo "Starting ngrok..."
        ngrok http 8080 --log=stdout > ngrok.log &

        echo "Waiting for ngrok to initialize..."
        URL=""
        for i in {1..30}; do
          URL=$(curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            break
          fi
          sleep 2
        done

        if [ -z "$URL" ] || [ "$URL" == "null" ]; then
          echo "Failed to get ngrok URL"
          exit 1
        fi

        echo "Temporary public URL: $URL"
        echo "Service will be available for 5 minutes..."
        sleep 300
